name: SignalBoostLK Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Unit tests use a local mock server; no live ISP servers are contacted.
      - name: Run unit tests
        run: python -m pytest -q tests

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SignalBoostLK `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --add-data "app/ui/assets;app/ui/assets" `
            --add-data "app/config;app/config" `
            main.py

      # Start the packaged app headless for a few seconds; fail if it exits
      # early (e.g. missing bundled config or an import error).
      - name: Smoke-test executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/SignalBoostLK.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "SignalBoostLK.exe exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Executable started and stayed running."

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SignalBoostLK-Windows
          path: dist/SignalBoostLK.exe
          if-no-files-found: error
          retention-days: 30

  # On a published GitHub Release, attach the .exe to the release so the
  # download link does not expire like workflow artifacts do.
  attach-to-release:
    name: Attach EXE to release
    if: github.event_name == 'release'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built executable
        uses: actions/download-artifact@v4
        with:
          name: SignalBoostLK-Windows

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            SignalBoostLK.exe --clobber --repo "${{ github.repository }}"
